<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart | HappynessProject</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script>document.documentElement.classList.add('hp-auth-pending');</script>
</head>
<body>
  <main class="hp-cart-page">
    <h1>Your Cart <span id="cart-count" class="hp-cart-page-count"></span></h1>
    <section id="cart-items" class="hp-cart-items" aria-live="polite"></section>
    <section id="cart-empty" class="hp-cart-empty">
      <p>Your selected trips will appear here.</p>
      <a href="upcoming-events.html">Browse Upcoming Trips</a>
    </section>
    <aside id="cart-summary" class="hp-cart-summary" hidden>
      <div><span>Subtotal</span><strong id="cart-subtotal"></strong></div>
      <button class="hp-book-now-button" type="button" data-checkout-cart>Book Now</button>
    </aside>
    <a class="hp-cart-continue" href="upcoming-events.html">Continue exploring</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/header.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/checkout.js"></script>
</body>
</html>
