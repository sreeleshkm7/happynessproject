<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- MAIN SCROLLABLE CONTENT CANVAS (Mobile Form Factor Centered) -->
<main class="flex-grow flex flex-col items-center px-4 py-4 max-w-md mx-auto w-full pb-16">
<!-- Scenic Travel Hero Strip -->

<div class="w-full h-full bg-cover bg-center" data-alt="A cinematic sun-drenched coastal lagoon and misty pine cliffs in early morning golden light, shot with clean minimal aesthetic in rich coastal teals and warm sand highlights, embodying serene exploration and peaceful wanderlust." style="background-image: url('../images/login-image-01-ac0fc50.jpg')"></div>
<!-- Soft Coastal Teal Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-primary/80 via-primary/30 to-transparent flex flex-col justify-end p-4">
<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-surface-container-lowest/90 backdrop-blur-md text-primary font-label-sm text-label-sm w-fit shadow-xs mb-1">
<span class="material-symbols-outlined text-[14px]">explore</span>

        </span>
<p class="text-white font-title-md text-title-md drop-shadow-sm font-semibold">"Collect moments, not things."</p>
</div>
</div>
<!-- Editorial Headline & Subtext -->
<div class="w-full mb-6 text-left">
<h1 class="text-headline-md font-headline-md text-on-surface tracking-tight">Welcome back</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant mt-1 leading-relaxed">
        Sign in to book trips, save favourites and host your own journeys.
      </p>
</div>
<!-- Tab Switcher: [Login] (active) | [Sign Up] -->
<div class="w-full grid grid-cols-2 p-1 bg-surface-container rounded-xl mb-6">
<button class="py-2.5 text-center font-label-lg text-label-lg rounded-lg transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-bold" data-auth-tab="login" id="loginTabBtn" onclick="switchTab('login')" type="button">

<button class="py-2.5 text-center font-label-lg text-label-lg rounded-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface" data-auth-tab="signup" id="signupTabBtn" onclick="switchTab('signup')" type="button">
        Sign Up
      </button>
</div>
<!-- TAB 1: LOGIN FORM CARD -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-6 shadow-[0_4px_20px_-2px_rgba(15,118,110,0.06),0_2px_6px_-1px_rgba(31,41,55,0.04)] border border-surface-variant/40 transition-all duration-300" id="loginFormContainer">
<form class="space-y-4" id="login-form" onsubmit="handleLoginSubmit(event)">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1.5" for="usernameInput">Email</label>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-on-surface-variant material-symbols-outlined text-[20px] pointer-events-none">person</span>
<input autocomplete="email" class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest border border-surface-variant rounded-xl font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all placeholder:text-outline" id="usernameInput" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-1.5">
<label class="block font-label-md text-label-md text-on-surface" for="passwordInput">Password</label>
</div>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-on-surface-variant material-symbols-outlined text-[20px] pointer-events-none">lock</span>
<input autocomplete="current-password" class="w-full h-12 pl-11 pr-12 bg-surface-container-lowest border border-surface-variant rounded-xl font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all" id="passwordInput" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password view" class="absolute right-3 p-1.5 rounded-lg text-on-surface-variant hover:text-primary transition-colors focus:outline-none" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordEyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Checkbox & Forgot Password Link -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2.5 cursor-pointer select-none">
<input checked="" class="w-5 h-5 rounded text-primary-container focus:ring-primary-container border-outline/50 cursor-pointer" id="rememberMe" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface">Remember me</span>
</label>

            Forgot password?
          </a>

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>

<!-- TAB 2: SIGN UP CONTAINER (Hidden by default, toggleable) -->

<form class="space-y-3.5" id="signup-form" onsubmit="handleSignupSubmit(event)">
<div>

<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="signup-username">Username</label>
<input autocomplete="username" class="w-full h-11 px-4 bg-surface-container-lowest border border-surface-variant rounded-xl font-body-sm text-body-sm focus:ring-2 focus:ring-primary-container focus:outline-none" id="signup-username" name="username" placeholder="Pick a unique handle" required type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="signup-email">Email Address</label>
<input autocomplete="email" class="w-full h-11 px-4 bg-surface-container-lowest border border-surface-variant rounded-xl font-body-sm text-body-sm focus:ring-2 focus:ring-primary-container focus:outline-none" id="signup-email" name="email" placeholder="name@domain.com" required type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="signup-mobile">Mobile Number</label>
<div class="flex gap-2">
<span class="inline-flex items-center px-3 rounded-xl bg-surface-container text-on-surface font-label-md text-label-md border border-surface-variant">+91</span>
<input autocomplete="tel-national" class="flex-1 h-11 px-4 bg-surface-container-lowest border border-surface-variant rounded-xl font-body-sm text-body-sm focus:ring-2 focus:ring-primary-container focus:outline-none" id="signup-mobile" name="mobile" placeholder="98765 43210" required type="tel"/>
</div>
</div>
<div class="grid grid-cols-2 gap-2">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="signup-password">Password</label>
<input autocomplete="new-password" class="w-full h-11 px-3 bg-surface-container-lowest border border-surface-variant rounded-xl font-body-sm text-body-sm focus:ring-2 focus:ring-primary-container focus:outline-none" id="signup-password" minlength="6" name="password" placeholder="••••••••" required type="password"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="signup-confirm-password">Confirm</label>
<input autocomplete="new-password" class="w-full h-11 px-3 bg-surface-container-lowest border border-surface-variant rounded-xl font-body-sm text-body-sm focus:ring-2 focus:ring-primary-container focus:outline-none" id="signup-confirm-password" minlength="6" name="confirm_password" placeholder="••••••••" required type="password"/>
</div>
</div>
<button class="w-full h-12 mt-3 bg-secondary-container hover:bg-[#e05334] text-white font-label-lg text-label-lg rounded-xl shadow-sm hover:-translate-y-0.5 transition-all" type="submit">
          Create Account
        </button>
<p class="text-center font-body-sm text-body-sm text-on-surface-variant pt-1">
          Already registered? 
          <button class="font-label-md text-label-md text-primary font-semibold hover:underline ml-1" onclick="switchTab('login')" type="button">
            Login here
          </button>
</p>
</form>
</div>
<div aria-live="polite" class="w-full mt-4 text-sm text-center text-error" hidden id="auth-message" role="alert"></div>
</main>
<!-- Login form and tab interactions -->
<script>
    function switchTab(tab) {
      const loginBtn = document.getElementById('loginTabBtn');
      const signupBtn = document.getElementById('signupTabBtn');
      const loginForm = document.getElementById('loginFormContainer');
      const signupForm = document.getElementById('signupFormContainer');

      if (tab === 'login') {
        loginBtn.className = "py-2.5 text-center font-label-lg text-label-lg rounded-lg transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-bold";
        signupBtn.className = "py-2.5 text-center font-label-lg text-label-lg rounded-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface";
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
      } else {
        signupBtn.className = "py-2.5 text-center font-label-lg text-label-lg rounded-lg transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-bold";
        loginBtn.className = "py-2.5 text-center font-label-lg text-label-lg rounded-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface";
        signupForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
    }

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('passwordEyeIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        eyeIcon.textContent = 'visibility';
      }
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      window.HappynessAuth.handleLogin(event.currentTarget);
    }

    function handleSignupSubmit(event) {
      event.preventDefault();
      window.HappynessAuth.handleSignup(event.currentTarget);
    }

    if (window.location.hash === '#signup') switchTab('signup');
  </script>
