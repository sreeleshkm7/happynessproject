<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | HappynessProject</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="hp-placeholder">
    <h1>Reset your password</h1>
    <p>Enter the email address for your account and we will send you a password reset link.</p>
    <div aria-live="polite" hidden id="auth-message" role="alert"></div>
    <form id="reset-request-form" onsubmit="return sendResetRequest(event)">
      <label for="reset-email">Email address</label>
      <input autocomplete="email" id="reset-email" name="email" required type="email">
      <button type="submit">Send Reset Link</button>
    </form>
    <form hidden id="password-update-form" onsubmit="return updateAccountPassword(event)">
      <label for="new-password">New password</label>
      <input autocomplete="new-password" id="new-password" minlength="6" name="password" required type="password">
      <label for="confirm-new-password">Confirm new password</label>
      <input autocomplete="new-password" id="confirm-new-password" minlength="6" name="confirm_password" required type="password">
      <button type="submit">Update Password</button>
    </form>
    <p><a href="login.html">Return to Login</a></p>
  </main>
  <script>
    function sendResetRequest(event) {
      event.preventDefault();
      window.HappynessAuth.sendPasswordReset(event.currentTarget);
      return false;
    }

    function updateAccountPassword(event) {
      event.preventDefault();
      window.HappynessAuth.updatePassword(event.currentTarget);
      return false;
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/header.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
